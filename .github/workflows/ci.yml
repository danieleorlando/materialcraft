name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: materialcraft package
        working-directory: packages/materialcraft
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Gallery submission script
        run: python3 -m unittest discover -s tool
